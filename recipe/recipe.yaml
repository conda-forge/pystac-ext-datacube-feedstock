schema_version: 1

context:
  version: "2.2.1"

package:
  name: pystac-ext-datacube
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-datacube/pystac_ext_datacube-${{ version }}.tar.gz
  sha256: 80f7ecbc82dee5d713f2c6ad4f87cd01a7559c1f77fc9e51d2ff9bd06c4db5ae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.datacube
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Datacube extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-datacube/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
